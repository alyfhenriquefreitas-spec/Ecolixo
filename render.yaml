services:
  - type: web
    name: ecolixo-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecolixo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ecolixo-db
    databaseName: ecolixo
    user: ecolixo_user
    plan: free
